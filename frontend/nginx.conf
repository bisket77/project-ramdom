# nginx.conf
# ตั้งค่าให้ทุก request ที่หา static file ไม่เจอ ให้ตกไปที่ index.html เสมอ
# จำเป็นสำหรับ Single Page Application (SPA) เพื่อไม่ให้ refresh หน้าแล้วเจอ 404

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ตั้งค่า cache ให้ asset ที่มี hash ในชื่อไฟล์ (js, css จาก Vite build)
    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
